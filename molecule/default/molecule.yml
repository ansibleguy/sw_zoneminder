---

dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: test-ag-zm-tester
    docker_networks:
      - name: 'test-ag-zm'
        ipam_config:
          - subnet: '192.168.0.0/24'
            gateway: '192.168.0.254'
    networks:
      - name: 'test-ag-zm'
        ipv4_address: '192.168.0.1'
    etc_hosts: {zoneminder.test.ansibleguy.net: '192.168.0.2'}
    groups: [grp_tester]
    docker_host: 'tcp://molecule-docker.local:2375'
    image: 'ansible0guy/molecule:debian-latest'
    tmpfs: ['/tmp', '/run', '/run/lock']
    privileged: true

  - name: test-ag-zm-1
    networks:
      - name: 'test-ag-zm'
        ipv4_address: '192.168.0.2'
    groups: [grp_targets]
    docker_host: 'tcp://molecule-docker.local:2375'
    image: 'ansible0guy/molecule:debian-latest'
    tmpfs: ['/tmp', '/run', '/run/lock']
    privileged: true

provisioner:
  name: ansible
verifier:
  name: ansible
scenario:
  name: default
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - verify  # MUST NOT make changes
    - idempotence
    - check
    - destroy
